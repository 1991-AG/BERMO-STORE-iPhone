name: Build BERMO STORE iPhone

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Simulator App
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Zip iOS App
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r BERMO-STORE-iOS-Simulator.zip App.app

      - name: Upload iOS App
        uses: actions/upload-artifact@v4
        with:
          name: BERMO-STORE-iOS
          path: build/Build/Products/Debug-iphonesimulator/BERMO-STORE-iOS-Simulator.zip
